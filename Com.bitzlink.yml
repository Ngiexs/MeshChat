AutoName: MeshChat
Summary: Peer-to-peer encrypted group chat over Tor
Description: |-
  MeshChat is a peer-to-peer encrypted group chat that runs
  entirely over Tor. No central server, no account, and no phone
  number required.

  Messages are encrypted with AES-256-GCM and routed through the
  Tor network. A backup node takes over automatically if the host
  disconnects.
